# The spring_rag upstream lives in spring-rag-upstream.conf (same conf.d
# directory) and is regenerated by the spring-rag-cd Jenkins pipeline on
# every blue-green switch. Do not define it here.

server {
    listen 80;
    server_name _;
   
    # Default: redirect root to /openclaw/
    location = / {
    	rewrite ^ /openclaw/ last;
    }

    location ^~ /api/ {
	rewrite ^/api/(.*)$ /claude/api/$1 last;
    }

    # /openclaw -> localhost:8181
    location /openclaw/ {
        proxy_pass         http://host.docker.internal:8181/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # /claude -> load-balanced spring-rag instances (same backend as /spring-rag)
    location /claude/ {
        proxy_pass         http://spring_rag/;

        proxy_connect_timeout 240s;
        proxy_send_timeout   240s;
        proxy_read_timeout   300s;  # most important — increase this

        proxy_next_upstream        error timeout http_502 http_503;
        proxy_next_upstream_tries  3;


        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # /jenkins -> localhost:8484
    location /jenkins {
        proxy_pass         http://host.docker.internal:8484;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

	# Recommended to fix redirect loops
	proxy_redirect     default;

	#proxy_set_header   Upgrade           $http_upgrade;
	#proxy_set_header   Connection        "upgrade";
    }

# /kibana -> localhost:5601
    location /kibana/ {
        proxy_pass         http://host.docker.internal:5601;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }


    location /aspire/ {
        proxy_pass         http://host.docker.internal:18888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
	#proxy_set_header   X-Forwarded-Prefix /aspire;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # /spring-rag -> load-balanced spring-rag instances
    location /spring-rag/ {
        proxy_pass         http://spring_rag/;

        proxy_connect_timeout 240s;
        proxy_send_timeout   240s;
        proxy_read_timeout   300s;  # most important — increase this

        # Fail over to the next instance if one is down or being redeployed
        proxy_next_upstream        error timeout http_502 http_503;
        proxy_next_upstream_tries  3;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
