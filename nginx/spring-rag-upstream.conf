# Initial spring-rag upstream — blue color, ports 8585-8587.
# The spring-rag-cd Jenkins pipeline overwrites this file on every
# blue-green switch (blue = 8585.., green = 8590..). color=blue
upstream spring_rag {
    least_conn;
    server host.docker.internal:8585 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8586 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8587 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
