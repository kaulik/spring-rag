# Standalone Redis for spring-rag agent memory (conversational memory +
# task state). Same standalone pattern as kafka/n8n. No persistence —
# both data classes are ephemeral by design (24h / 1h TTLs).
# maxmemory is hard-capped: this host has a history of OOM kills.
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
