# Test profile – disable config server client and provide safe no-op values
# so the context loads without a live Ollama / Weaviate / config-server instance.
# NOTE: this file shadows src/main/resources/application.yml on the test
# classpath, so the mandatory configserver import does not apply to tests.
# All properties must be listed here: the @ConfigurationProperties classes
# carry no Java defaults and are @Validated.
spring:
  application:
    name: spring-rag
  cloud:
    config:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379

# Consumed by OtelLoggingConfig (@Value, no fallback).
OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318

rag:
  ollama:
    base-url: http://localhost:11434
    embedding-model: nomic-embed-text
    chat-model: llama3.2:3b
    rerank-model: ""
    timeout-seconds: 60
  weaviate:
    base-url: http://localhost:8383
    collection: testCollection
    text-field: text
  retrieval:
    top-k: 10
    hybrid-alpha: 0.5
    rerank-top-k: 5
    rerank-enabled: true
    rerank-preview-chars: 150
  chunking:
    sentences-per-chunk: 3
    token-overlap: 20

# Multi-agent knobs — Java defaults exist, listed here for explicitness.
agents:
  router:
    model: ""
  knowledge-base:
    model: ""
  stock:
    model: ""
    api-base-url: http://localhost:19999   # never reached in tests
  general:
    model: ""
  memory:
    window: 10

guardrails:
  api-key: test-api-key
  allowed-origins: http://localhost:8282,http://localhost:3000
  rate-limit:
    requests-per-minute: 30
  input:
    max-query-length: 1000
    max-context-length: 50000
