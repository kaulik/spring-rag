<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Assistant</title>
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #1e40af;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .container {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 500;
      color: #475569;
      margin-top: 0.9rem;
      margin-bottom: 0.35rem;
    }
    label:first-of-type { margin-top: 0; }

    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.93rem;
      font-family: inherit;
      resize: vertical;
      background: #f8fafc;
      transition: border-color .15s, background .15s;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.52rem 1.2rem;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary   { background: #16a34a; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #15803d; }

    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }

    .status {
      font-size: 0.8rem;
      color: #64748b;
      flex: 1;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Answer */
    .answer-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      white-space: pre-wrap;
      font-size: 0.93rem;
      line-height: 1.65;
      min-height: 3.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: 0.45rem;
      vertical-align: middle;
    }

    .sources-list {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .source-item {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.83rem;
    }
    .source-item strong {
      display: block;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }
    .source-item code {
      color: #475569;
      white-space: pre-wrap;
      font-size: 0.78rem;
      font-family: ui-monospace, monospace;
    }

    .info-pill {
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      padding: 0.15rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #94a3b8;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>🔍 RAG Assistant — Spring Boot</header>

<div class="container">

  <!-- API Key card -->
  <div class="card">
    <div class="card-title">API Key</div>
    <label for="api-key">X-API-Key</label>
    <input type="password" id="api-key" placeholder="Enter your API key" />
  </div>

  <!-- Ingest card -->
  <div class="card">
    <div class="card-title">Ingest into knowledge base (/api/v2/ingest)</div>

    <label for="v2-source">Source label <span style="font-weight:400;color:#94a3b8;">(optional)</span></label>
    <input type="text" id="v2-source"
           placeholder="e.g. meeting-notes, patient-summary" />

    <label for="v2-ctx">Context text</label>
    <textarea id="v2-ctx" rows="6"
      placeholder="Paste text to ingest into the knowledge base..."></textarea>

    <div class="row">
      <button class="btn-primary" id="v2-ingest-btn" onclick="runIngestV2()">
        Ingest
      </button>
      <span class="status" id="v2-status"></span>
    </div>
  </div>

  <!-- Agent card -->
  <div class="card">
    <div class="card-title">
      Multi-agent orchestrator (/api/v2/agent)
      <span id="conversation-pill" class="info-pill" style="display:none;"></span>
    </div>

    <label for="agent-query">Your question</label>
    <textarea id="agent-query" rows="3"
      placeholder="Ask anything — an LLM router picks knowledge-base, stock, or general chat..."></textarea>

    <div class="row">
      <button class="btn-primary" id="agent-ask-btn" onclick="runAgent()">
        Ask
      </button>
      <button class="btn-secondary" id="agent-new-btn" onclick="newConversation()">
        New Conversation
      </button>
      <span class="status" id="agent-status"></span>
    </div>
  </div>

  <!-- Answer card (hidden until a query runs) -->
  <div class="card" id="answer-card" style="display:none;">
    <div class="card-title">
      Answer
      <span id="intent-pill" class="badge" style="display:none;"></span>
      <span id="agent-pill" class="badge" style="display:none;"></span>
      <span id="chunks-pill" class="info-pill" style="display:none;"></span>
    </div>
    <div class="answer-box" id="answer-text"></div>

    <div id="sources-section" style="margin-top:1.25rem; display:none;">
      <div class="card-title" style="margin-bottom:.6rem;">
        Sources <span class="badge" id="source-count">0</span>
      </div>
      <div class="sources-list" id="sources-list"></div>
    </div>
  </div>

</div>

<script>
  const API = '';   // same origin; change to 'http://localhost:8080' if CORS needed

  // --------------------------------------------------------------------------
  // Helpers
  // --------------------------------------------------------------------------
  function setStatus(id, html) {
    document.getElementById(id).innerHTML = html;
  }

  function loading(statusId) {
    return '<span class="spinner"></span>Running…';
  }

  function showAnswer(data) {
    const card      = document.getElementById('answer-card');
    const answerEl  = document.getElementById('answer-text');
    const srcSection = document.getElementById('sources-section');
    const srcList   = document.getElementById('sources-list');
    const badge     = document.getElementById('source-count');
    const chunksPill = document.getElementById('chunks-pill');
    const intentPill = document.getElementById('intent-pill');
    const agentPill  = document.getElementById('agent-pill');

    // Answer text
    answerEl.textContent = data.answer || '(no answer)';
    card.style.display = 'block';

    // Ingested chunks pill
    if (data.ingestedChunks != null && data.ingestedChunks > 0) {
      chunksPill.textContent = data.ingestedChunks + ' chunks ingested';
      chunksPill.style.display = 'inline-block';
    } else {
      chunksPill.style.display = 'none';
    }

    // Intent / agent pills — present on /api/v2/agent responses only
    if (data.intent) {
      intentPill.textContent = data.intent;
      intentPill.style.display = 'inline-flex';
    } else {
      intentPill.style.display = 'none';
    }
    if (data.agent) {
      agentPill.textContent = data.agent;
      agentPill.style.display = 'inline-flex';
    } else {
      agentPill.style.display = 'none';
    }

    // Sources
    const sources = Array.isArray(data.sources) ? data.sources : [];
    badge.textContent = sources.length;

    if (sources.length > 0) {
      srcSection.style.display = 'block';
      srcList.innerHTML = '';
      sources.forEach(s => {
        const div = document.createElement('div');
        div.className = 'source-item';
        const title   = escHtml(s.source || 'unknown');
        const preview = escHtml((s.text || s.preview || '').substring(0, 500));
        div.innerHTML = '<strong>' + title + '</strong><code>' + preview + '</code>';
        srcList.appendChild(div);
      });
    } else {
      srcSection.style.display = 'none';
    }

    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escHtml(s) {
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
  }

  // --------------------------------------------------------------------------
  // Ingest — /api/v2/ingest
  // --------------------------------------------------------------------------
  async function runIngestV2() {
    const contextText = document.getElementById('v2-ctx').value.trim();
    const source      = document.getElementById('v2-source').value.trim() || 'frontend';

    if (!contextText) { setStatus('v2-status', '⚠ Paste some context text first.'); return; }

    const btn = document.getElementById('v2-ingest-btn');
    btn.disabled = true;
    setStatus('v2-status', loading());

    try {
      const apiKey = document.getElementById('api-key').value.trim();
      const resp = await fetch(API + '/api/v2/ingest', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
        body:    JSON.stringify({ contextText, source }),
      });

      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — ' + await resp.text());
      const data = await resp.json();

      setStatus('v2-status', `✅ Done &nbsp;·&nbsp; ${data.ingestedChunks} chunks ingested`);
    } catch (err) {
      setStatus('v2-status', '❌ ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  // --------------------------------------------------------------------------
  // Multi-agent orchestrator — /api/v2/agent
  // --------------------------------------------------------------------------
  let currentConversationId = null;

  function updateConversationPill() {
    const pill = document.getElementById('conversation-pill');
    if (currentConversationId) {
      pill.textContent = 'conversation: ' + currentConversationId.substring(0, 8);
      pill.style.display = 'inline-flex';
    } else {
      pill.style.display = 'none';
    }
  }

  function newConversation() {
    currentConversationId = null;
    updateConversationPill();
    document.getElementById('agent-query').value = '';
    document.getElementById('answer-card').style.display = 'none';
    setStatus('agent-status', 'Started a new conversation.');
  }

  async function runAgent() {
    const query = document.getElementById('agent-query').value.trim();

    if (!query) { setStatus('agent-status', '⚠ Enter a question.'); return; }

    const btn = document.getElementById('agent-ask-btn');
    btn.disabled = true;
    setStatus('agent-status', loading());
    document.getElementById('answer-card').style.display = 'none';

    try {
      const apiKey = document.getElementById('api-key').value.trim();
      const resp = await fetch(API + '/api/v2/agent', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
        body:    JSON.stringify({ query, conversationId: currentConversationId }),
      });

      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' — ' + await resp.text());
      const data = await resp.json();

      currentConversationId = data.conversationId;
      updateConversationPill();

      setStatus('agent-status', 'Done.');
      showAnswer(data);
    } catch (err) {
      setStatus('agent-status', '❌ ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
