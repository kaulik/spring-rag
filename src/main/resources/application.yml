spring:
  application:
    name: spring-rag
  config:
    # Mandatory (no "optional:" prefix): startup fails if the config server
    # cannot be reached, instead of silently running on framework defaults.
    # CONFIG_SERVER_URL has no fallback — the deployment must set it.
    import: "configserver:${CONFIG_SERVER_URL}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 3000
